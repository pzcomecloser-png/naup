<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>게임 모음</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    width: 100%; height: 100%; background: #0a0a1a;
    font-family: 'Courier New', 'Malgun Gothic', monospace;
    overflow: hidden;
  }
  #app {
    position: relative; width: 100%; height: 100%; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 16px;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.04) 0, transparent 40%),
      #0a0a1a;
  }

  .page-title {
    color: #ffe15a; font-size: clamp(16px, 5.5vw, 24px); font-weight: 900;
    letter-spacing: 2px; text-shadow: 2px 2px 0 #000, 0 0 14px rgba(255,225,90,.5);
    margin-bottom: 2px; text-align: center;
  }

  .card-list { display: flex; flex-direction: column; gap: 11px; width: 100%; max-width: 330px; }

  .game-card {
    display: flex; align-items: center; gap: 12px;
    background: #14142c; border: 3px solid #3a3a5c; border-radius: 6px;
    padding: 8px 12px; text-decoration: none; cursor: pointer;
    box-shadow: 0 4px 0 #05050f, 0 5px 12px rgba(0,0,0,.5);
    transition: transform .1s ease;
  }
  .game-card:active { transform: translateY(3px); box-shadow: 0 1px 0 #05050f; }

  .icon-frame {
    flex: none; width: 56px; height: 56px; background: #05050f;
    border: 2px solid #4a4a72; border-radius: 4px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .icon-frame canvas {
    width: 46px; height: 46px;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }

  .card-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .card-title { color: #fff; font-size: clamp(13px, 3.8vw, 16px); font-weight: 900; letter-spacing: 0.5px; text-shadow: 1px 1px 0 #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-desc { color: #a0a0c8; font-size: clamp(9.5px, 2.5vw, 11.5px); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-arrow { margin-left: auto; color: #ffe15a; font-size: 18px; font-weight: 900; flex: none; padding-left: 4px; }

  .footer-hint {
    margin-top: 4px; color: #5a5a80; font-size: clamp(9px, 2vw, 11px); text-align: center; letter-spacing: .5px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="page-title">GAME SELECT</div>

  <div class="card-list">
    <!-- 1. 나 키우기 -->
    <a class="game-card" href="naup.html">
      <div class="icon-frame"><canvas id="iconNaup" width="24" height="24"></canvas></div>
      <div class="card-text">
        <div class="card-title">나 키우기</div>
        <div class="card-desc">육성 시뮬레이션 개그물</div>
      </div>
      <div class="card-arrow">▶</div>
    </a>

    <!-- 2. 지구침공 -->
    <a class="game-card" href="g9att.html">
      <div class="icon-frame"><canvas id="iconUfo" width="24" height="24"></canvas></div>
      <div class="card-text">
        <div class="card-title">지구침공</div>
        <div class="card-desc">횡스크롤 액션 게임</div>
      </div>
      <div class="card-arrow">▶</div>
    </a>

    <!-- 3. 양상치 소녀의 모험 -->
    <a class="game-card" href="lettuce_adventure_ver_02.html">
      <div class="icon-frame"><canvas id="iconLettuce" width="24" height="24"></canvas></div>
      <div class="card-text">
        <div class="card-title">양상치 소녀의 모험</div>
        <div class="card-desc">플랫포머 어드벤처 게임</div>
      </div>
      <div class="card-arrow">▶</div>
    </a>

    <!-- 4. 신마협전 -->
    <a class="game-card" href="신마협전 v0.0.3.html">
      <div class="icon-frame"><canvas id="iconSinma" width="24" height="24"></canvas></div>
      <div class="card-text">
        <div class="card-title">신마협전</div>
        <div class="card-desc">정통 무협 RPG 어드벤처</div>
      </div>
      <div class="card-arrow">▶</div>
    </a>
  </div>

  <div class="footer-hint">PRESS TO START</div>
</div>

<script>
// 픽셀아트 아이콘을 캔버스에 직접 그립니다 (24x24 저해상도 → CSS로 확대해 픽셀 느낌 유지)

function drawNaupIcon(id) {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,24,24);

  // 안테나
  ctx.fillStyle = '#ff5a5a';
  ctx.fillRect(11, 1, 2, 2);
  ctx.fillStyle = '#b9c3cf';
  ctx.fillRect(11, 3, 2, 3);

  // 머리 (헬멧형)
  ctx.fillStyle = '#eef3f8';
  ctx.fillRect(7, 6, 10, 7);
  ctx.fillStyle = '#2b3f66';
  ctx.fillRect(9, 7, 6, 4);

  // 눈
  ctx.fillStyle = '#3a9bff';
  ctx.fillRect(10, 8, 1, 1);
  ctx.fillRect(13, 8, 1, 1);

  // 목
  ctx.fillStyle = '#b9c3cf';
  ctx.fillRect(10, 13, 4, 1);

  // 몸통
  ctx.fillStyle = '#3a72e0';
  ctx.fillRect(6, 14, 12, 6);
  ctx.fillStyle = '#eef3f8';
  ctx.fillRect(9, 16, 6, 3);
  ctx.fillStyle = '#ffd76a';
  ctx.fillRect(10, 17, 1, 1);
  ctx.fillRect(13, 17, 1, 1);

  // 팔
  ctx.fillStyle = '#2652a8';
  ctx.fillRect(4, 15, 2, 4);
  ctx.fillRect(18, 15, 2, 4);

  // 다리
  ctx.fillStyle = '#22315c';
  ctx.fillRect(8, 20, 3, 3);
  ctx.fillRect(13, 20, 3, 3);
}

function drawUfoIcon(id) {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,24,24);

  // 별
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(3, 3, 1, 1);
  ctx.fillRect(19, 5, 1, 1);
  ctx.fillRect(20, 15, 1, 1);
  ctx.fillRect(4, 18, 1, 1);

  // 빔
  ctx.fillStyle = 'rgba(150,255,180,0.35)';
  ctx.beginPath();
  ctx.moveTo(9, 13); ctx.lineTo(15, 13); ctx.lineTo(19, 22); ctx.lineTo(5, 22);
  ctx.closePath(); ctx.fill();

  // UFO 돔
  ctx.fillStyle = '#c3c8e0';
  ctx.beginPath();
  ctx.ellipse(12, 9, 5, 4, 0, Math.PI, 0);
  ctx.fill();

  // UFO 몸체
  ctx.fillStyle = '#8a8fa8';
  ctx.fillRect(3, 11, 18, 3);
  ctx.fillStyle = '#6a6f88';
  ctx.fillRect(3, 13, 18, 1);

  // 불빛
  ctx.fillStyle = '#5af06e';
  ctx.fillRect(5, 12, 1, 1);
  ctx.fillRect(9, 12, 1, 1);
  ctx.fillRect(14, 12, 1, 1);
  ctx.fillRect(18, 12, 1, 1);
}

function drawLettuceIcon(id) {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, 24, 24);

  // 1. 양상추 머리 베이스 (녹색 톤)
  ctx.fillStyle = '#4fa348';
  ctx.fillRect(6, 2, 12, 9);
  ctx.fillRect(4, 4, 15, 7);

  // 밝은 녹색 하이라이트
  ctx.fillStyle = '#82cf6e';
  ctx.fillRect(9, 3, 7, 5);
  ctx.fillRect(8, 4, 8, 4);

  // 하얀 윤기/광택 라인
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(11, 4, 3, 1);
  ctx.fillRect(14, 5, 2, 1);

  // 2. 얼굴 / 피부 (측면)
  ctx.fillStyle = '#ffd0a6';
  ctx.fillRect(12, 9, 4, 3);

  // 눈 & 볼터치
  ctx.fillStyle = '#4a2820';
  ctx.fillRect(15, 9, 1, 2);
  ctx.fillStyle = '#ff6b8b';
  ctx.fillRect(14, 10, 3, 1);

  // 3. 노란 셔츠 & 팔
  ctx.fillStyle = '#ffc83b';
  ctx.fillRect(10, 11, 5, 2);
  ctx.fillStyle = '#ffd0a6';
  ctx.fillRect(8, 13, 2, 3);
  ctx.fillRect(14, 12, 3, 4);

  // 4. 파란 멜빵 바지
  ctx.fillStyle = '#357ae8';
  ctx.fillRect(10, 13, 5, 5);
  ctx.fillStyle = '#2459b8';
  ctx.fillRect(12, 14, 2, 2);

  // 5. 다리 & 신발
  ctx.fillStyle = '#2459b8';
  ctx.fillRect(10, 17, 3, 2);
  ctx.fillStyle = '#ff9626';
  ctx.fillRect(13, 17, 4, 3);
  ctx.fillStyle = '#ffc83b';
  ctx.fillRect(9, 18, 5, 3);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(9, 21, 5, 1);
}

function drawSinmaIcon(id) {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, 24, 24);

  // 1. 포니테일 / 휘날리는 갈색 장발
  ctx.fillStyle = '#2e1910';
  ctx.fillRect(15, 2, 5, 6);
  ctx.fillRect(18, 4, 4, 7);
  ctx.fillRect(19, 9, 3, 5);

  // 2. 메인 머리카락 (앞머리 및 볼륨)
  ctx.fillStyle = '#3d2417';
  ctx.fillRect(7, 2, 9, 4);
  ctx.fillRect(5, 4, 11, 4);
  ctx.fillStyle = '#543322';
  ctx.fillRect(8, 3, 6, 2); // 하이라이트

  // 3. 얼굴 & 목 (살구색 톤)
  ctx.fillStyle = '#f6cfa9';
  ctx.fillRect(7, 6, 8, 7);
  ctx.fillRect(9, 13, 4, 2); // 목

  // 얼굴 음영
  ctx.fillStyle = '#e2b38b';
  ctx.fillRect(6, 8, 2, 4);
  ctx.fillRect(13, 9, 2, 3);

  // 구레나룻 & 잔머리
  ctx.fillStyle = '#2e1910';
  ctx.fillRect(5, 6, 2, 5);
  ctx.fillRect(7, 5, 2, 4);
  ctx.fillRect(11, 4, 2, 3);

  // 눈썹 & 이목구비
  ctx.fillStyle = '#24140c';
  ctx.fillRect(8, 7, 2, 1);  // 왼쪽 눈썹
  ctx.fillRect(12, 7, 2, 1); // 오른쪽 눈썹
  ctx.fillRect(8, 8, 2, 1);  // 왼쪽 눈
  ctx.fillRect(12, 8, 2, 1); // 오른쪽 눈
  ctx.fillStyle = '#9e624b';
  ctx.fillRect(10, 9, 1, 2); // 코
  ctx.fillRect(10, 11, 2, 1); // 입

  // 4. 무협 의복 (어깨 깃 & 노란 끈 / 띠 장식)
  ctx.fillStyle = '#dcd8d0'; // 연회색 도포 깃
  ctx.fillRect(6, 14, 11, 7);
  ctx.fillStyle = '#495a6a'; // 청회색 겉옷
  ctx.fillRect(4, 16, 3, 7);
  ctx.fillRect(16, 16, 4, 7);

  ctx.fillStyle = '#d89b34'; // 황금색/황토색 가슴 띠
  ctx.fillRect(8, 16, 6, 2);
  ctx.fillRect(9, 18, 5, 2);

  // 5. 무협 손목 아대 (팔)
  ctx.fillStyle = '#3a271d'; // 가죽 완갑
  ctx.fillRect(3, 19, 4, 4);
  ctx.fillRect(16, 19, 4, 4);
  ctx.fillStyle = '#d89b34'; // 완갑 금속 테두리
  ctx.fillRect(3, 18, 4, 1);
  ctx.fillRect(16, 18, 4, 1);
}

drawNaupIcon('iconNaup');
drawUfoIcon('iconUfo');
drawLettuceIcon('iconLettuce');
drawSinmaIcon('iconSinma');
</script>
</body>
</html>
