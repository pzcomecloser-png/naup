<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>게임 모음</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    width: 100%; height: 100%; background: #0a0a1a;
    font-family: 'Courier New', 'Malgun Gothic', monospace;
    overflow: hidden;
  }
  #app {
    position: relative; width: 100%; height: 100%; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.04) 0, transparent 40%),
      #0a0a1a;
  }

  .page-title {
    color: #ffe15a; font-size: clamp(16px, 5.5vw, 24px); font-weight: 900;
    letter-spacing: 2px; text-shadow: 2px 2px 0 #000, 0 0 14px rgba(255,225,90,.5);
    margin-bottom: 2px; text-align: center;
  }

  .card-list { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; max-height: 80vh; overflow-y: auto; padding: 4px; }
  .card-list::-webkit-scrollbar { display: none; }

  .game-card {
    display: flex; align-items: center; gap: 12px;
    background: #14142c; border: 3px solid #3a3a5c; border-radius: 6px;
    padding: 8px 12px; text-decoration: none; cursor: pointer;
    box-shadow: 0 4px 0 #05050f, 0 5px 12px rgba(0,0,0,.5);
    transition: transform .1s ease;
  }
  .game-card:active { transform: translateY(3px); box-shadow: 0 1px 0 #05050f; }

  .icon-frame {
    flex: none; width: 56px; height: 56px; background: #05050f;
    border: 2px solid #4a4a72; border-radius: 4px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .icon-frame canvas {
    width: 46px; height: 46px;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }

  .card-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .card-title { color: #fff; font-size: clamp(13px, 3.8vw, 16px); font-weight: 900; letter-spacing: 0.5px; text-shadow: 1px 1px 0 #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-desc { color: #a0a0c8; font-size: clamp(9.5px, 2.5vw, 11.5px); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-arrow { margin-left: auto; color: #ffe15a; font-size: 18px; font-weight: 900; flex: none; padding-left: 4px; }

  .footer-hint {
    margin-top: 2px; color: #5a5a80; font-size: clamp(9px, 2vw, 11px); text-align: center; letter-spacing: .5px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="page-title">GAME SELECT</div>

  <div class="card-list">
    <!-- 1. 나 키우기 -->
    <a class="game-card" href="naup.html">
      <div class="icon-frame"><canvas id="iconNaup" width="24" height="24"></canvas></div>
      <div class="card-text">
        <div class="card-title">나 키우기</div>
        <div class="card-desc">육성 시뮬레이션 개그물</div>
      </div>
      <div class="card-arrow">▶</div>
    </a>

    <!-- 2. 지구침공 -->
    <a class="game-card" href="g9att.html">
      <div class="icon-frame"><canvas id="iconUfo" width="24" height="24"></canvas></div>
      <div class="card-text">
        <div class="card-title">지구침공</div>
        <div class="card-desc">횡스크롤 액션 게임</div>
      </div>
      <div class="card-arrow">▶</div>
    </a>

    <!-- 3. 양상치 소녀의 모험 -->
    <a class="game-card" href="lettuce_adventure_ver_02.html">
      <div class="icon-frame"><canvas id="iconLettuce" width="24" height="24"></canvas></div>
      <div class="card-text">
        <div class="card-title">양상치 소녀의 모험</div>
        <div class="card-desc">플랫포머 어드벤처 게임</div>
      </div>
      <div class="card-arrow">▶</div>
    </a>

    <!-- 4. 삼국무쌍: 도원의 검 (NEW) -->
    <a class="game-card" href="three_kingdoms_slash.html">
      <div class="icon-frame"><canvas id="iconThreeKingdoms" width="24" height="24"></canvas></div>
      <div class="card-text">
        <div class="card-title">삼국무쌍: 도원의 검</div>
        <div class="card-desc">2D 도트 핵앤슬래시 무협 액션</div>
      </div>
      <div class="card-arrow">▶</div>
    </a>

    <!-- 5. 배틀 쉽 -->
    <a class="game-card" href="Battleship.html">
      <div class="icon-frame"><canvas id="iconBattleship" width="24" height="24"></canvas></div>
      <div class="card-text">
        <div class="card-title">배틀 쉽</div>
        <div class="card-desc">본격 해양 전투 시뮬레이션</div>
      </div>
      <div class="card-arrow">▶</div>
    </a>

    <!-- 6. 세계를 구하자 -->
    <a class="game-card" href="save_the_world_ver_01.html">
      <div class="icon-frame"><canvas id="iconSaveWorld" width="24" height="24"></canvas></div>
      <div class="card-text">
        <div class="card-title">세계를 구하자</div>
        <div class="card-desc">초단편 마왕 토벌 RPG</div>
      </div>
      <div class="card-arrow">▶</div>
    </a>

    <!-- 7. 세계를 구하자 2 -->
    <a class="game-card" href="save_the_world_part2.html">
      <div class="icon-frame"><canvas id="iconSaveWorld2" width="24" height="24"></canvas></div>
      <div class="card-text">
        <div class="card-title">세계를 구하자 2</div>
        <div class="card-desc">마왕이 된 전직 용사의 귀환</div>
      </div>
      <div class="card-arrow">▶</div>
    </a>
  </div>

  <div class="footer-hint">PRESS TO START</div>
</div>

<script>
// 픽셀아트 아이콘을 캔버스에 직접 그립니다 (24x24 저해상도 → CSS로 확대해 픽셀 느낌 유지)

function drawNaupIcon(id) {
  const c = document.getElementById(id);
  if (!c) return;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,24,24);

  // 안테나
  ctx.fillStyle = '#ff5a5a';
  ctx.fillRect(11, 1, 2, 2);
  ctx.fillStyle = '#b9c3cf';
  ctx.fillRect(11, 3, 2, 3);

  // 머리 (헬멧형)
  ctx.fillStyle = '#eef3f8';
  ctx.fillRect(7, 6, 10, 7);
  ctx.fillStyle = '#2b3f66';
  ctx.fillRect(9, 7, 6, 4);

  // 눈
  ctx.fillStyle = '#3a9bff';
  ctx.fillRect(10, 8, 1, 1);
  ctx.fillRect(13, 8, 1, 1);

  // 목
  ctx.fillStyle = '#b9c3cf';
  ctx.fillRect(10, 13, 4, 1);

  // 몸통
  ctx.fillStyle = '#3a72e0';
  ctx.fillRect(6, 14, 12, 6);
  ctx.fillStyle = '#eef3f8';
  ctx.fillRect(9, 16, 6, 3);
  ctx.fillStyle = '#ffd76a';
  ctx.fillRect(10, 17, 1, 1);
  ctx.fillRect(13, 17, 1, 1);

  // 팔
  ctx.fillStyle = '#2652a8';
  ctx.fillRect(4, 15, 2, 4);
  ctx.fillRect(18, 15, 2, 4);

  // 다리
  ctx.fillStyle = '#22315c';
  ctx.fillRect(8, 20, 3, 3);
  ctx.fillRect(13, 20, 3, 3);
}

function drawUfoIcon(id) {
  const c = document.getElementById(id);
  if (!c) return;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,24,24);

  // 별
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(3, 3, 1, 1);
  ctx.fillRect(19, 5, 1, 1);
  ctx.fillRect(20, 15, 1, 1);
  ctx.fillRect(4, 18, 1, 1);

  // 빔
  ctx.fillStyle = 'rgba(150,255,180,0.35)';
  ctx.beginPath();
  ctx.moveTo(9, 13); ctx.lineTo(15, 13); ctx.lineTo(19, 22); ctx.lineTo(5, 22);
  ctx.closePath(); ctx.fill();

  // UFO 돔
  ctx.fillStyle = '#c3c8e0';
  ctx.beginPath();
  ctx.ellipse(12, 9, 5, 4, 0, Math.PI, 0);
  ctx.fill();

  // UFO 몸체
  ctx.fillStyle = '#8a8fa8';
  ctx.fillRect(3, 11, 18, 3);
  ctx.fillStyle = '#6a6f88';
  ctx.fillRect(3, 13, 18, 1);

  // 불빛
  ctx.fillStyle = '#5af06e';
  ctx.fillRect(5, 12, 1, 1);
  ctx.fillRect(9, 12, 1, 1);
  ctx.fillRect(14, 12, 1, 1);
  ctx.fillRect(18, 12, 1, 1);
}

function drawLettuceIcon(id) {
  const c = document.getElementById(id);
  if (!c) return;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, 24, 24);

  // 1. 양상추 머리 베이스 (녹색 톤)
  ctx.fillStyle = '#4fa348';
  ctx.fillRect(6, 2, 12, 9);
  ctx.fillRect(4, 4, 15, 7);

  // 밝은 녹색 하이라이트
  ctx.fillStyle = '#82cf6e';
  ctx.fillRect(9, 3, 7, 5);
  ctx.fillRect(8, 4, 8, 4);

  // 하얀 윤기/광택 라인
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(11, 4, 3, 1);
  ctx.fillRect(14, 5, 2, 1);

  // 2. 얼굴 / 피부 (측면)
  ctx.fillStyle = '#ffd0a6';
  ctx.fillRect(12, 9, 4, 3);

  // 눈 & 볼터치
  ctx.fillStyle = '#4a2820';
  ctx.fillRect(15, 9, 1, 2);
  ctx.fillStyle = '#ff6b8b';
  ctx.fillRect(14, 10, 3, 1);

  // 3. 노란 셔츠 & 팔
  ctx.fillStyle = '#ffc83b';
  ctx.fillRect(10, 11, 5, 2);
  ctx.fillStyle = '#ffd0a6';
  ctx.fillRect(8, 13, 2, 3);
  ctx.fillRect(14, 12, 3, 4);

  // 4. 파란 멜빵 바지
  ctx.fillStyle = '#357ae8';
  ctx.fillRect(10, 13, 5, 5);
  ctx.fillStyle = '#2459b8';
  ctx.fillRect(12, 14, 2, 2);

  // 5. 다리 & 신발
  ctx.fillStyle = '#2459b8';
  ctx.fillRect(10, 17, 3, 2);
  ctx.fillStyle = '#ff9626';
  ctx.fillRect(13, 17, 4, 3);
  ctx.fillStyle = '#ffc83b';
  ctx.fillRect(9, 18, 5, 3);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(9, 21, 5, 1);
}

// 4. 삼국무쌍: 도원의 검 아이콘 (관우의 청룡언월도 + 흩날리는 도원 벚꽃잎)
function drawThreeKingdomsIcon(id) {
  const c = document.getElementById(id);
  if (!c) return;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, 24, 24);

  // 1. 노을빛 전장/도원결의 배경
  ctx.fillStyle = '#2b1418';
  ctx.fillRect(0, 0, 24, 24);
  ctx.fillStyle = '#4a2220';
  ctx.fillRect(2, 2, 20, 20);

  // 2. 도원의 흩날리는 분홍 벚꽃잎
  ctx.fillStyle = '#ff8ea8';
  ctx.fillRect(3, 4, 2, 2);
  ctx.fillRect(19, 6, 2, 2);
  ctx.fillRect(5, 17, 2, 2);
  ctx.fillRect(17, 19, 2, 2);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(4, 4, 1, 1);
  ctx.fillRect(19, 7, 1, 1);

  // 3. 청룡언월도 대각선 자루 (나무 봉)
  ctx.fillStyle = '#4a2f1c';
  ctx.fillRect(4, 18, 3, 3);
  ctx.fillRect(6, 16, 3, 3);
  ctx.fillRect(8, 14, 3, 3);
  ctx.fillRect(10, 12, 3, 3);
  ctx.fillRect(12, 10, 3, 3);

  // 황금 술 / 용머리 장식
  ctx.fillStyle = '#e8c93a';
  ctx.fillRect(12, 9, 4, 4);
  ctx.fillStyle = '#b8202a'; // 붉은 술
  ctx.fillRect(11, 12, 3, 4);

  // 4. 청룡언월도 푸른/은빛 대도날 (Guandao Blade)
  ctx.fillStyle = '#dfe7ea'; // 메인 은빛 칼날
  ctx.fillRect(14, 4, 4, 6);
  ctx.fillRect(16, 2, 4, 5);
  ctx.fillRect(18, 1, 3, 4);
  ctx.fillRect(15, 6, 5, 4);

  // 청룡 푸른 검기/광택 (Green Blade Glow)
  ctx.fillStyle = '#43a96d';
  ctx.fillRect(14, 5, 2, 4);
  ctx.fillRect(16, 3, 2, 3);

  // 칼등 돌기 & 칼날 끝 하이라이트
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(19, 1, 2, 2);
  ctx.fillRect(18, 3, 1, 1);
  ctx.fillRect(15, 9, 3, 1);
}

// 5. 배틀 쉽 아이콘 (바다 위 군함 전함 + 주포 포격 + 레이더 조준선)
function drawBattleshipIcon(id) {
  const c = document.getElementById(id);
  if (!c) return;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, 24, 24);

  // 1. 하늘 & 바다 배경
  ctx.fillStyle = '#0a1d37'; // 짙은 밤바다 하늘
  ctx.fillRect(0, 0, 24, 13);
  ctx.fillStyle = '#0c356a'; // 깊은 바다
  ctx.fillRect(0, 13, 24, 11);

  // 파도 물결 & 하이라이트
  ctx.fillStyle = '#0174be';
  ctx.fillRect(2, 16, 5, 1);
  ctx.fillRect(15, 17, 6, 1);
  ctx.fillRect(0, 21, 24, 3);
  ctx.fillStyle = '#40f8ff'; // 흰 포말
  ctx.fillRect(1, 15, 3, 1);
  ctx.fillRect(19, 15, 4, 1);

  // 레이더 그리드 원 & 탐지선
  ctx.strokeStyle = 'rgba(0, 255, 180, 0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(12, 10, 8, 0, Math.PI * 2);
  ctx.stroke();

  // 2. 전함 선체 (Hull) - 웅장한 전함 실루엣
  ctx.fillStyle = '#1e293b'; // 선체 하단 어두운 섀도우
  ctx.beginPath();
  ctx.moveTo(2, 15);
  ctx.lineTo(21, 15);
  ctx.lineTo(18, 18);
  ctx.lineTo(4, 18);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#475569'; // 선체 메인 강철 장갑
  ctx.fillRect(4, 13, 15, 2);
  ctx.fillRect(19, 13, 2, 1); // 함수(선두) 경사

  // 함교 (Bridge / Superstructure)
  ctx.fillStyle = '#94a3b8';
  ctx.fillRect(8, 9, 6, 4);
  ctx.fillStyle = '#cbd5e1'; // 함교 창문/탑
  ctx.fillRect(9, 7, 4, 2);
  ctx.fillRect(10, 5, 2, 2); // 마스트

  // 레이다 안테나
  ctx.fillStyle = '#00ffcc';
  ctx.fillRect(10, 4, 2, 1);

  // 3. 주포 터렛 & 포신 (Main Gun Turrets)
  // 전방 주포 (포격 불꽃 발사!)
  ctx.fillStyle = '#64748b';
  ctx.fillRect(14, 11, 4, 2);
  ctx.fillStyle = '#334155';
  ctx.fillRect(17, 10, 3, 1); // 포신 각도

  // 포격 화염 이펙트 (Muzzle Flash)
  ctx.fillStyle = '#ff9900';
  ctx.fillRect(20, 9, 2, 2);
  ctx.fillStyle = '#ffff00';
  ctx.fillRect(21, 9, 1, 1);

  // 후방 주포
  ctx.fillStyle = '#64748b';
  ctx.fillRect(5, 11, 3, 2);
  ctx.fillStyle = '#334155';
  ctx.fillRect(4, 10, 2, 1);
}

// 5. 세계를 구하자 아이콘 (2개의 뿔을 가진 마왕의 흉악한 얼굴 픽셀아트)
function drawSaveWorldIcon(id) {
  const c = document.getElementById(id);
  if (!c) return;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, 24, 24);

  // 1. 어둠/보라빛 오라 배경
  ctx.fillStyle = '#1a0526';
  ctx.fillRect(0, 0, 24, 24);
  ctx.fillStyle = '#450a36';
  ctx.fillRect(2, 2, 20, 20);

  // 2. 2개의 거대한 마왕 뿔 (왼쪽 & 오른쪽)
  ctx.fillStyle = '#edd298';
  // 왼쪽 뿔
  ctx.fillRect(4, 2, 2, 4);
  ctx.fillRect(5, 5, 2, 3);
  ctx.fillRect(6, 7, 2, 2);
  // 오른쪽 뿔
  ctx.fillRect(18, 2, 2, 4);
  ctx.fillRect(17, 5, 2, 3);
  ctx.fillRect(16, 7, 2, 2);

  // 뿔 끝부분 어두운 팁 & 그림자
  ctx.fillStyle = '#c79a4b';
  ctx.fillRect(4, 1, 2, 1);
  ctx.fillRect(18, 1, 2, 1);
  ctx.fillStyle = '#8f6826';
  ctx.fillRect(6, 6, 1, 3);
  ctx.fillRect(17, 6, 1, 3);

  // 3. 마왕 붉은 피부 머리/얼굴 베이스
  ctx.fillStyle = '#a81334';
  ctx.fillRect(6, 8, 12, 11);
  ctx.fillRect(5, 10, 14, 8);
  ctx.fillRect(7, 19, 10, 2);

  // 이마 & 볼 하이라이트
  ctx.fillStyle = '#c72045';
  ctx.fillRect(8, 9, 8, 2);
  ctx.fillRect(6, 11, 2, 4);
  ctx.fillRect(16, 11, 2, 4);

  // 4. 사악하고 찢어진 눈 (노란 안광 + 붉은 눈동자)
  ctx.fillStyle = '#5e071b'; // 눈썹 음영
  ctx.fillRect(7, 11, 4, 1);
  ctx.fillRect(13, 11, 4, 1);

  ctx.fillStyle = '#ffee00'; // 노란 안광
  ctx.fillRect(7, 12, 4, 2);
  ctx.fillRect(13, 12, 4, 2);

  ctx.fillStyle = '#ff0000'; // 붉은 동공
  ctx.fillRect(9, 12, 2, 2);
  ctx.fillRect(13, 12, 2, 2);

  // 5. 비웃는 마왕 입 & 날카로운 이빨 (송곳니)
  ctx.fillStyle = '#150308'; // 입 속 어둠
  ctx.fillRect(8, 15, 8, 4);

  ctx.fillStyle = '#ffffff'; // 상단/하단 뾰족한 이빨
  ctx.fillRect(8, 15, 2, 2);  // 윗 송곳니 (좌)
  ctx.fillRect(14, 15, 2, 2); // 윗 송곳니 (우)
  ctx.fillRect(10, 15, 1, 1);
  ctx.fillRect(13, 15, 1, 1);
  ctx.fillRect(10, 18, 1, 1); // 아랫니
  ctx.fillRect(13, 18, 1, 1);

  // 6. 턱 & 어깨 망토 깃
  ctx.fillStyle = '#22092c';
  ctx.fillRect(4, 20, 4, 3);
  ctx.fillRect(16, 20, 4, 3);
  ctx.fillStyle = '#e5b83b'; // 목 장식 금테
  ctx.fillRect(8, 21, 8, 2);
}

// 6. 세계를 구하자 2 아이콘 (푸른빛 2대 용사 투구 + 전설의 악마뿔 인수인계)
function drawSaveWorld2Icon(id) {
  const c = document.getElementById(id);
  if (!c) return;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, 24, 24);

  // 1. 차가운 블루 심연 배경
  ctx.fillStyle = '#06101e';
  ctx.fillRect(0, 0, 24, 24);
  ctx.fillStyle = '#0f243d';
  ctx.fillRect(2, 2, 20, 20);

  // 2. 2대 용사에게 씌워지는 뿔 (황금 & 주황 그라데이션)
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(4, 2, 2, 4);
  ctx.fillRect(18, 2, 2, 4);
  ctx.fillStyle = '#ff5500';
  ctx.fillRect(5, 5, 2, 2);
  ctx.fillRect(17, 5, 2, 2);

  // 3. 2대 용사 은빛 투구 & 헤어
  ctx.fillStyle = '#eceff1'; // 백은빛 투구
  ctx.fillRect(7, 6, 10, 4);
  ctx.fillRect(6, 8, 12, 10);
  ctx.fillStyle = '#ffffff'; // 투구 광택
  ctx.fillRect(8, 6, 4, 2);

  // 4. 얼굴 & 눈 (푸른 안광)
