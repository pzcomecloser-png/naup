  <style>
    @import url('https://fonts.googleapis.com/css2?family=Galmuri11:wght@400;700&display=swap');

<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>
  <div class="instructions">
    [WASD / 방향키 이동] &nbsp; [E 또는 ⏳ 버튼 = 제자리 대기] &nbsp; [Space/R = 되감기]
  </div>

<script>
/* ============================================================
   8-BIT SOUND ENGINE
============================================================ */
class SoundEngine {
  constructor() { this.ctx = null; this.muted = false; }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  playTone(freq, type, duration, gainVal = 0.1) {
    if (this.muted || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(); osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  }
  playMove() { this.init(); this.playTone(320, 'square', 0.05, 0.06); }
  playBlocked() { this.init(); this.playTone(120, 'sawtooth', 0.08, 0.12); }
  playKey() { this.init(); this.playTone(660, 'triangle', 0.15, 0.12); }
  playDoorOpen() {
    this.init();
    this.playTone(523.25, 'sine', 0.1, 0.1);
    setTimeout(() => this.playTone(783.99, 'sine', 0.2, 0.12), 90);
  }
  playRewind() {
    this.init();
    this.playTone(700, 'sawtooth', 0.25, 0.1);
    setTimeout(() => this.playTone(300, 'sawtooth', 0.2, 0.1), 120);
  }
  playVanish() {
    this.init();
    this.playTone(500, 'sine', 0.12, 0.08);
    setTimeout(() => this.playTone(280, 'sine', 0.18, 0.08), 80);
  }
  playWin() {
    this.init();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'triangle', 0.25, 0.14), i * 100);
    });
  }
  playFail() {
    this.init();
    this.playTone(220, 'sawtooth', 0.3, 0.15);
    setTimeout(() => this.playTone(140, 'sawtooth', 0.4, 0.15), 200);
  }
  playOminous() {
    this.init();
    if (this.muted || !this.ctx) return;
    try {
      const osc1 = this.ctx.createOscillator();
      const osc2 = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      // ① sawtooth(배음 폭탄) → triangle(부드러운 저음)으로 변경
      osc1.type = 'triangle'; osc2.type = 'sine';
      osc1.frequency.setValueAtTime(120, this.ctx.currentTime);
      osc1.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + 3);
      osc2.frequency.setValueAtTime(124, this.ctx.currentTime);
      osc2.frequency.exponentialRampToValueAtTime(46, this.ctx.currentTime + 3);

      // ② 저역대 웅웅거림을 깎아내는 로우패스 필터 추가
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(400, this.ctx.currentTime);
      filter.Q.value = 0.7;

      // ③ 진짜 작게: 오실레이터 2개가 합쳐지는 걸 감안해 0.02로, 부드럽게 페이드인 후 지수감쇠
      gain.gain.setValueAtTime(0.0001, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.02, this.ctx.currentTime + 0.15);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 3);

      osc1.connect(filter); osc2.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      osc1.start(); osc2.start();
      osc1.stop(this.ctx.currentTime + 3); osc2.stop(this.ctx.currentTime + 3);
    } catch(e) {}
  }
  playCaught() {
    this.init();
    this.playTone(150, 'sawtooth', 0.2, 0.3);
    setTimeout(() => this.playTone(100, 'sawtooth', 0.5, 0.4), 150);
  }
  playClick() { this.init(); this.playTone(500, 'square', 0.06, 0.08); }
}
const audio = new SoundEngine();

/* ============================================================
   GRID CONSTANTS
============================================================ */
const GRID_SIZE = 10;
const CELL = 42;
const gridX = 190, gridY = 90;
const FLOOR = 0, WALL = 1;
// 이제 타일 번호가 복잡해지므로 타일 정보를 객체로 관리합니다.
// type: 'floor', 'wall', 'key', 'door', 'exit'
// color: 0(빨강), 1(파랑) 등 (key와 door 매칭용)

/* ============================================================
   STAGE DEFINITIONS (여러 스테이지를 하나의 파일에서 관리)
============================================================ */
const STAGES = [
  {
    name: "첫 되감기",
    sub: "발판을 지키며 출구로 — 되감기 기본 학습",
    totalTime: 45,
    startPos: { col: 1, row: 7 },
    keysCount: 1,
    build: (g) => {
      g[3][1] = { type: 'key', color: 0 }; // 0: 노란색(기본)
      g[7][7] = { type: 'door', color: 0, isExit: true }; // 노란문이 곧 출구
    }
  },
  {
    name: "엇갈린 길",
    sub: "멈추지 말고 달려야 합니다",
    totalTime: 45,
    startPos: { col: 1, row: 7 },
    keysCount: 2,
    build: (g) => {
      // 2스테이지 재설계: 대기(Wait) 없이 멈추지 않고 계속 달려야 하는 구조
      for (let r = 1; r < GRID_SIZE - 1; r++) {
        if (r !== 7) g[r][4] = { type: 'wall' }; // 중간 세로 벽
      }
      // 열쇠 1 (왼쪽 구석) - 노란색
      g[1][1] = { type: 'key', color: 0 };
      // 열쇠 2 (중앙 통로 근처) - 파란색
      g[5][3] = { type: 'key', color: 2 };
      g[6][8] = { type: 'door', color: 'all', isExit: true }; 
    }
  },
  {
    name: "연쇄 작용 (Cascade)",
    sub: "과거가 문을 열면, 과거가 다시 지나갑니다",
    totalTime: 45,
    startPos: { col: 1, row: 8 },
    keysCount: 2,
    build: (g) => {
      // 벽 세팅 (지그재그 구조)
      for (let r = 1; r < 9; r++) { if (r !== 7) g[r][3] = { type: 'wall' }; }
      for (let r = 1; r < 9; r++) { if (r !== 2) g[r][6] = { type: 'wall' }; }
      
      // 빨간색 그룹
      g[3][1] = { type: 'key', color: 1 }; // 빨강 발판 (1번방)
      g[7][3] = { type: 'door', color: 1 }; // 빨강 문 (위로 한 칸 이동)

      // 파란색 그룹
      g[8][4] = { type: 'key', color: 2 }; // 파랑 발판 (2번방)
      g[2][6] = { type: 'door', color: 2 }; // 파랑 문 (아래로 한 칸 이동)

      // 최종 출구 (3번방)
      g[3][8] = { type: 'exit' }; // 발판 필요없는 최종 골인 지점 (아래로 한 칸 이동)
    }
  },
  {
    name: "시간 감시자",
    sub: "첫 되감기 시, 당신을 쫓는 감시자가 깨어납니다",
    totalTime: 45,
    startPos: { col: 1, row: 8 },
    watcherSpawn: { col: 7, row: 2 },
    keysCount: 1,
    build: (g) => {
      // 미로 구조
      for(let r = 1; r <= 7; r++) g[r][4] = { type: 'wall' };
      g[2][4] = { type: 'floor' }; // 구멍
      g[7][4] = { type: 'floor' }; // 구멍

      g[2][1] = { type: 'key', color: 0 };
      g[7][8] = { type: 'door', color: 0, isExit: true };
    }
  }
];

function buildBaseGrid() {
  const g = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    const row = [];
    for (let c = 0; c < GRID_SIZE; c++) {
      if (r === 0 || r === GRID_SIZE - 1 || c === 0 || c === GRID_SIZE - 1) {
        row.push({ type: 'wall' });
      } else {
        row.push({ type: 'floor' });
      }
    }
    g.push(row);
  }
  return g;
}

/* ============================================================
   GAME STATE
============================================================ */
const SCREEN = { TITLE: 'TITLE', SELECT: 'SELECT', PLAYING: 'PLAYING', WIN: 'WIN', TIMEUP: 'TIMEUP', GAMEOVER: 'GAMEOVER', ENDING: 'ENDING' };
let currentScreen = SCREEN.TITLE;

let stageIdx = 0;
let grid = null;
let startPos = null, doorPos = null, keyPositions = null;

let player = { col: 0, row: 0, history: [] };
let ghosts = [];
let watchers = [];
let currentTick = 0;
let loopCount = 1;

let TOTAL_TIME = 60;
let timeLeft = TOTAL_TIME;

let popups = [];
let flashAlpha = 0;
let watcherIntroTimer = 0;
let lastTime = performance.now();

function showPopup(txt, x, y, col = '#ffffff') {
  popups.push({ txt, x, y, col, alpha: 1, vy: -0.6 });
}

/* ============================================================
   STAGE LOADING
============================================================ */
function loadStage(idx) {
  const stage = STAGES[idx];
  stageIdx = idx;
  grid = buildBaseGrid();
  stage.build(grid);
  startPos = stage.startPos;
  doorPos = stage.doorPos;
  keyPositions = stage.keyPositions;
  TOTAL_TIME = stage.totalTime;
  timeLeft = TOTAL_TIME;

  player = { col: startPos.col, row: startPos.row, history: [] };
  ghosts = [];
  watchers = [];
  watcherIntroTimer = 0;
  currentTick = 0;
  loopCount = 1;
  popups = [];
  currentScreen = SCREEN.PLAYING;
}

/* ============================================================
   CORE LOGIC
   ── 유령(과거의 나)의 위치는 매번 "시작점 + 현재 틱까지의 기록"을
   ── 처음부터 다시 계산하는 순수 함수 방식이라, 되감기를 몇 번을
   ── 반복해도 절대 오차(드리프트)가 쌓이지 않습니다.
============================================================ */
const MAX_REWINDS = 5; // 되감기(과거의 나) 최대 유지 수

// tick 시점의 유령 상태(위치/생존여부)를 매번 새로 계산 — 상태를 저장하지 않는다
function ghostStateAt(ghost, tick) {
  const H = ghost.history.length;
  const effective = Math.min(tick, H);
  let col = startPos.col, row = startPos.row;
  for (let i = 0; i < effective; i++) {
    const d = DIRS[ghost.history[i]];
    col += d.dc;
    row += d.dr;
  }
  // H턴에 마지막 이동(=발판 도착), 그 다음 턴(H+1)이 되는 순간 즉시 사라짐
  const alive = tick <= H;
  const grace = tick === H;
  return { col, row, alive, grace };
}

// grid는 2차원 배열. 요소는 { type: 'floor'|'wall'|'key'|'door'|'exit', color: 0|1|2... }
function isEntityOnExactKey(entCol, entRow, keyR, keyC) {
  return entCol === keyC && entRow === keyR;
}

function keyHeldStatusAt(tick, pCol, pRow, keyR, keyC) {
  if (isEntityOnExactKey(pCol, pRow, keyR, keyC)) return true;
  return ghosts.some(g => {
    const s = ghostStateAt(g, tick);
    return s.alive && isEntityOnExactKey(s.col, s.row, keyR, keyC);
  });
}

function isDoorOpenNow(targetCol, targetRow, atTick, pCol, pRow) {
  const doorTile = grid[targetRow][targetCol];
  if (doorTile.type !== 'door') return true;

  // 인자가 안 넘어오면 현재 상태 기준으로 판정 (렌더링용)
  const tick = (atTick === undefined) ? currentTick : atTick;
  const px = (pCol === undefined) ? player.col : pCol;
  const py = (pRow === undefined) ? player.row : pRow;

  let keysToCheck = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (grid[r][c].type === 'key') {
        if (doorTile.color === 'all' || grid[r][c].color === doorTile.color) {
          keysToCheck.push({r, c});
        }
      }
    }
  }

  return keysToCheck.every(k => keyHeldStatusAt(tick, px, py, k.r, k.c));
}

// Watcher pathfinding BFS
function getNextWatcherMove(wCol, wRow, pCol, pRow) {
  const queue = [{c: wCol, r: wRow, path: []}];
  const visited = Array.from({length: GRID_SIZE}, () => Array(GRID_SIZE).fill(false));
  visited[wRow][wCol] = true;

  while(queue.length > 0) {
    const curr = queue.shift();
    if (curr.c === pCol && curr.r === pRow) {
      return curr.path[0] || {dc: 0, dr: 0};
    }
    for (const dir in DIRS) {
      if (dir === 'wait') continue;
      const nc = curr.c + DIRS[dir].dc;
      const nr = curr.r + DIRS[dir].dr;
      if (nc >= 0 && nc < GRID_SIZE && nr >= 0 && nr < GRID_SIZE) {
        if (!visited[nr][nc]) {
          const tile = grid[nr][nc];
          let isPassable = true;
          if (tile.type === 'wall') isPassable = false;
          if (tile.type === 'door' && !isDoorOpenNow(nc, nr)) isPassable = false;

          if (isPassable) {
            visited[nr][nc] = true;
            queue.push({c: nc, r: nr, path: [...curr.path, {dc: DIRS[dir].dc, dr: DIRS[dir].dr}]});
          }
        }
      }
    }
  }
  return {dc: 0, dr: 0};
}

const DIRS = {
  up: { dc: 0, dr: -1 },
  down: { dc: 0, dr: 1 },
  left: { dc: -1, dr: 0 },
  right: { dc: 1, dr: 0 }
};

function attemptMove(dirName) {
  if (currentScreen !== SCREEN.PLAYING) return;
  const d = DIRS[dirName];
  const targetCol = player.col + d.dc;
  const targetRow = player.row + d.dr;

  if (targetCol < 0 || targetCol >= GRID_SIZE || targetRow < 0 || targetRow >= GRID_SIZE) {
    audio.playBlocked();
    return;
  }

  const tile = grid[targetRow][targetCol];
  const nextTick = currentTick + 1;

  if (tile.type === 'wall') { audio.playBlocked(); return; }

  // 문 판정: "도착하는 순간(nextTick)"의 상태로만 판정
  // → 열쇠가 밟힌 그 턴에 바로 문에 들어갈 수 있음 (직관적)
  if (tile.type === 'door') {
    const openOnArrival = isDoorOpenNow(targetCol, targetRow, nextTick, targetCol, targetRow);
    if (!openOnArrival) {
      audio.playBlocked();
      showPopup("문이 잠겼다!", targetCol * CELL + gridX, targetRow * CELL + gridY - 10, '#ff6b6b');
      return;
    }
  }

  // 이번 이동으로 어떤 유령이 방금 사라졌는지 체크 (효과음/팝업용)
  ghosts.forEach(g => {
    const before = ghostStateAt(g, currentTick);
    const after = ghostStateAt(g, nextTick);
    if (before.alive && !after.alive) {
      audio.playVanish();
      showPopup("💨 사라짐", before.col * CELL + gridX + CELL/2, before.row * CELL + gridY - 6, '#9aa8d8');
    }
  });

  // Move player
  player.col = targetCol;
  player.row = targetRow;
  player.history.push(dirName);
  currentTick = nextTick;

  // Move watchers
  watchers.forEach(w => {
    // Collision check before move (player walked into watcher)
    if (player.col === w.col && player.row === w.row) {
      currentScreen = SCREEN.GAMEOVER;
      audio.playCaught();
      return;
    }
    const move = getNextWatcherMove(w.col, w.row, player.col, player.row);
    w.col += move.dc;
    w.row += move.dr;
    // Collision check after move (watcher walked into player)
    if (player.col === w.col && player.row === w.row) {
      currentScreen = SCREEN.GAMEOVER;
      audio.playCaught();
    }
  });
  if (currentScreen === SCREEN.GAMEOVER) return;

  audio.playMove();

  if (tile.type === 'key') {
    audio.playKey();
    showPopup("🔑 열쇠 확보!", targetCol * CELL + gridX + CELL/2, targetRow * CELL + gridY - 6, '#ffe66d');
  }

  // 문을 통과하면 자동으로 열리는 효과음을 낸다 (인디아나 존스 통과 시에도)
  if (tile.type === 'door') {
    audio.playDoorOpen();
  }

  if (tile.type === 'exit' || (tile.type === 'door' && tile.isExit)) {
    currentScreen = SCREEN.WIN;
    audio.playWin();
  }
}

function doRewind() {
  if (currentScreen !== SCREEN.PLAYING) return;
  if (player.history.length === 0) {
    showPopup("아직 이동을 안 했어요!", 400, 300, '#ffcf6b');
    return;
  }
  if (ghosts.length >= MAX_REWINDS) {
    showPopup(`최대 ${MAX_REWINDS}번까지만 되감을 수 있어요!`, 400, 300, '#ff9f6b');
    audio.playBlocked();
    return;
  }

  // 첫 되감기 시 감시자 소환
  const stage = STAGES[stageIdx];
  if (stage.watcherSpawn && watchers.length === 0) {
    watchers.push({ col: stage.watcherSpawn.col, row: stage.watcherSpawn.row });
    audio.playOminous();
    watcherIntroTimer = 3.0; // 3초간 대사 표시
  } else {
    audio.playRewind();
  }

  flashAlpha = 1;
  ghosts.push({ history: [...player.history], colorIdx: ghosts.length % 3 });
  player.col = startPos.col;
  player.row = startPos.row;
  player.history = [];
  currentTick = 0;
  loopCount++;
  if (!stage.watcherSpawn || watchers.length > 1) {
    showPopup("⏪ 되감기!", 400, 300, '#8ecdf7');
  }
}

function resetLevel() {
  loadStage(stageIdx);
}

function goToSelect() {
  currentScreen = SCREEN.SELECT;
}

/* ============================================================
   RENDER
============================================================ */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function drawRect(x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}
function drawText(txt, x, y, size = 16, col = '#fff', align = 'center', weight = '700') {
  ctx.fillStyle = col;
  ctx.font = `${weight} ${size}px "Galmuri11", monospace`;
  ctx.textAlign = align;
  ctx.fillText(txt, x, y);
}

const GHOST_COLORS = ['#a8d8f0', '#f7c9e0', '#c8f0c0'];

// In-game control buttons
const BTN = {
  up: { x: 110, y: 522, w: 50, h: 32 },
  left: { x: 55, y: 558, w: 50, h: 32 },
  down: { x: 110, y: 558, w: 50, h: 32 },
  right: { x: 165, y: 558, w: 50, h: 32 },
  rewind: { x: 292, y: 528, w: 190, h: 60 },
  reset: { x: 620, y: 10, w: 60, h: 28 },
  menu: { x: 690, y: 10, w: 100, h: 28 }
};

// Stage select card buttons (computed per render)
let selectCards = [];

function drawGrid() {
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const x = gridX + c * CELL, y = gridY + r * CELL;
      const tile = grid[r][c];

      if (tile.type === 'wall') {
        drawRect(x, y, CELL, CELL, '#2b2b45');
        drawRect(x + 2, y + 2, CELL - 4, CELL - 4, '#3d3d63');
      } else {
        drawRect(x, y, CELL, CELL, (r + c) % 2 === 0 ? '#1a1a30' : '#1e1e38');

        if (tile.type === 'key') {
          const pressed = keyHeldStatusAt(currentTick, player.col, player.row, r, c);
          
          // 색상 매핑 (0: 노랑, 1: 빨강, 2: 파랑)
          const colors = ['#ffe66d', '#ff6b6b', '#6bc5ff'];
          const dimColors = ['#8a7020', '#8a2f2f', '#2f5f8a'];
          const tColor = colors[tile.color] || colors[0];
          const dColor = dimColors[tile.color] || dimColors[0];
          const kc = pressed ? tColor : dColor;

          const kcx = x + CELL / 2, kcy = y + CELL / 2;

          ctx.save();
          if (pressed) { ctx.shadowColor = tColor; ctx.shadowBlur = 16; }

          // 색깔 발판 (바닥 패드)
          ctx.globalAlpha = pressed ? 0.35 : 0.15;
          drawRect(x + 4, y + 4, CELL - 8, CELL - 8, tColor);
          ctx.globalAlpha = 1.0;

          // 픽셀아트 열쇠 그리기 (이모지 대신 직접 그려서 색상 적용)
          ctx.fillStyle = kc;
          // 열쇠 머리 (동그란 고리)
          ctx.lineWidth = 3.5;
          ctx.strokeStyle = kc;
          ctx.beginPath();
          ctx.arc(kcx - 4, kcy - 5, 5.5, 0, Math.PI * 2);
          ctx.stroke();
          // 열쇠 몸통 (대각선 축)
          ctx.beginPath();
          ctx.lineWidth = 3.5;
          ctx.moveTo(kcx - 1, kcy - 1);
          ctx.lineTo(kcx + 8, kcy + 8);
          ctx.stroke();
          // 열쇠 이빨 2개
          ctx.beginPath();
          ctx.lineWidth = 3;
          ctx.moveTo(kcx + 3, kcy + 4);
          ctx.lineTo(kcx + 7, kcy + 1);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(kcx + 6, kcy + 7);
          ctx.lineTo(kcx + 10, kcy + 4);
          ctx.stroke();
          ctx.restore();

          if (pressed) {
            ctx.strokeStyle = tColor;
            ctx.globalAlpha = 0.6;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x + CELL/2, y + CELL/2, CELL/2 - 3, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1.0;
          }
        } else if (tile.type === 'door') {
          const open = isDoorOpenNow(c, r);
          const colors = ['#ffe66d', '#ff6b6b', '#6bc5ff']; // 열쇠와 동일한 색상 매핑
          const dimColors = ['#8a7020', '#8a2f2f', '#2f5f8a'];
          
          let tColor, dColor;
          if (tile.color === 'all') {
            tColor = '#3ddc84'; dColor = '#2bb96b';
          } else {
            tColor = colors[tile.color] || colors[0];
            dColor = dimColors[tile.color] || dimColors[0];
          }

          // 문 프레임 (열리면 밝은 색, 닫히면 어두운 색)
          drawRect(x + 3, y + 3, CELL - 6, CELL - 6, open ? tColor : dColor);
          drawRect(x + 7, y + 7, CELL - 14, CELL - 14, open ? '#0d2b1a' : '#1a0d16');

          const dcx = x + CELL / 2, dcy = y + CELL / 2;
          ctx.save();
          if (open) {
            // 열린 상태: 초록 화살표 (통과 가능)
            ctx.fillStyle = '#3ddc84';
            ctx.shadowColor = '#3ddc84';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(dcx - 5, dcy - 7);
            ctx.lineTo(dcx + 6, dcy);
            ctx.lineTo(dcx - 5, dcy + 7);
            ctx.closePath();
            ctx.fill();
          } else {
            // 닫힌 상태: 자물쇠 픽셀아트
            ctx.strokeStyle = tColor;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(dcx, dcy - 4, 5, Math.PI, 0);
            ctx.stroke();
            ctx.fillStyle = tColor;
            drawRect(dcx - 7, dcy - 3, 14, 11, tColor);
            ctx.fillStyle = '#1a0d16';
            drawRect(dcx - 1.5, dcy + 1, 3, 4, '#1a0d16');
          }
          ctx.restore();
        } else if (tile.type === 'exit') {
          // 순수 출구 (발판 필요없음)
          drawRect(x + 3, y + 3, CELL - 6, CELL - 6, '#3ddc84');
          drawRect(x + 8, y + 8, CELL - 16, CELL - 16, '#2bb96b');
          // 출구 화살표 (초록 문)
          ctx.save();
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.moveTo(x + CELL/2 - 5, y + CELL/2 - 7);
          ctx.lineTo(x + CELL/2 + 6, y + CELL/2);
          ctx.lineTo(x + CELL/2 - 5, y + CELL/2 + 7);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }
    }
  }

  ctx.strokeStyle = 'rgba(120,140,255,0.15)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= GRID_SIZE; i++) {
    ctx.beginPath();
    ctx.moveTo(gridX + i * CELL, gridY);
    ctx.lineTo(gridX + i * CELL, gridY + GRID_SIZE * CELL);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(gridX, gridY + i * CELL);
    ctx.lineTo(gridX + GRID_SIZE * CELL, gridY + i * CELL);
    ctx.stroke();
  }
}

function drawEntity(col, row, color, alpha, label, outline) {
  const x = gridX + col * CELL, y = gridY + row * CELL;
  const cx = x + CELL / 2, cy = y + CELL / 2;
  const bob = 0; // static bob offset (reserved for future animation)

  ctx.save();
  ctx.globalAlpha = alpha;

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(cx, y + CELL - 6, 11, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // 몸통 (둥근 사각형 캐릭터 본체)
  const bw = CELL - 16, bh = CELL - 14;
  const bx = cx - bw / 2, by = cy - bh / 2 + 2;
  ctx.fillStyle = color;
  roundRect(bx, by, bw, bh, 8);
  ctx.fill();

  if (outline) {
    ctx.strokeStyle = outline;
    ctx.lineWidth = 2;
    roundRect(bx, by, bw, bh, 8);
    ctx.stroke();
  }

  // 배 하이라이트 (입체감)
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  roundRect(bx + 3, by + 3, bw - 6, bh * 0.4, 6);
  ctx.fill();

  // 작은 발 2개
  ctx.fillStyle = color;
  ctx.fillRect(cx - 9, by + bh - 3, 6, 5);
  ctx.fillRect(cx + 3, by + bh - 3, 6, 5);

  // 눈 (귀여운 동그란 눈 + 눈동자)
  const eyeY = cy - 3;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(cx - 6, eyeY, 4.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 6, eyeY, 4.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#20203a';
  ctx.beginPath(); ctx.arc(cx - 5.2, eyeY + 0.5, 2.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 6.8, eyeY + 0.5, 2.1, 0, Math.PI * 2); ctx.fill();

  // 볼터치
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(cx - 10, cy + 4, 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 10, cy + 4, 2.4, 0, Math.PI * 2); ctx.fill();

  ctx.restore();

  if (label) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, alpha + 0.35);
    drawText(label, cx, y - 4, 10, color);
    ctx.restore();
  }
}

// ── Watcher (시간 감시자) 그리기 ──
function drawWatcher(col, row, alpha) {
  const x = gridX + col * CELL, y = gridY + row * CELL;
  const cx = x + CELL / 2, cy = y + CELL / 2;
  const t = performance.now() / 1000;
  
  ctx.save();
  ctx.globalAlpha = alpha;

  // 유령 그림자 (빨간색 글로우)
  ctx.shadowColor = '#ff0044';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#ff0044'; // 검은색에서 시뻘건 색으로 변경하여 잘 보이게 함
  
  // 감시자 몸통 (팩맨 유령처럼 아래가 너풀거림)
  const w = CELL - 8;
  const h = CELL - 8;
  ctx.beginPath();
  ctx.arc(cx, cy - h/4, w/2, Math.PI, 0);
  ctx.lineTo(cx + w/2, cy + h/2);
  
  // 밑단 웨이브
  const waveCount = 3;
  const waveW = w / waveCount;
  for(let i=1; i<=waveCount; i++) {
    const wy = cy + h/2 - ((i%2 === 1) ? 4 : 0);
    ctx.lineTo(cx + w/2 - i*waveW + waveW/2, wy);
    ctx.lineTo(cx + w/2 - i*waveW, cy + h/2);
  }
  ctx.lineTo(cx - w/2, cy - h/4);
  ctx.fill();

  ctx.shadowBlur = 0;

  // 감시자 눈 (노란색/흰색으로 대비)
  const eyeBob = Math.sin(t * 8) * 1;
  ctx.fillStyle = '#ffff00';
  ctx.fillRect(cx - 8, cy - 6 + eyeBob, 6, 4);
  ctx.fillRect(cx + 2, cy - 6 + eyeBob, 6, 4);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(cx - 7, cy - 5 + eyeBob, 3, 2);
  ctx.fillRect(cx + 3, cy - 5 + eyeBob, 3, 2);

  ctx.restore();

  ctx.save();
  ctx.globalAlpha = Math.min(1, alpha + 0.35);
  drawText('감시자', cx, y - 8, 11, '#ff88aa');
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ── 캐릭터 아트웍 그리기 헬퍼 (자유 좌표, 크기 조절 가능) ──
function drawChar(cx, cy, scale, color, alpha, outline, opts = {}) {
  ctx.save();
  ctx.globalAlpha = alpha;
  const bw = 26 * scale, bh = 28 * scale;
  const bx = cx - bw / 2, by = cy - bh / 2;

  // 그림자
  if (opts.shadow !== false) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(cx, by + bh + 5 * scale, 11 * scale, 4 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // 몸통
  ctx.fillStyle = color;
  roundRect(bx, by, bw, bh, 8 * scale);
  ctx.fill();

  if (outline) {
    ctx.strokeStyle = outline;
    ctx.lineWidth = 2 * scale;
    roundRect(bx, by, bw, bh, 8 * scale);
    ctx.stroke();
  }

  // 하이라이트
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  roundRect(bx + 3 * scale, by + 3 * scale, bw - 6 * scale, bh * 0.4, 6 * scale);
  ctx.fill();

  // 발
  ctx.fillStyle = color;
  ctx.fillRect(cx - 9 * scale, by + bh - 3 * scale, 6 * scale, 5 * scale);
  ctx.fillRect(cx + 3 * scale, by + bh - 3 * scale, 6 * scale, 5 * scale);

  // 눈
  const eyeY = cy - 3 * scale;
  const eyeR = 4.2 * scale;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(cx - 6 * scale, eyeY, eyeR, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 6 * scale, eyeY, eyeR, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#20203a';
  const pupR = 2.1 * scale;
  const px = (opts.lookRight ? 0.9 : opts.lookLeft ? -0.9 : 0) * scale;
  ctx.beginPath(); ctx.arc(cx - 5.2 * scale + px, eyeY + 0.5 * scale, pupR, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 6.8 * scale + px, eyeY + 0.5 * scale, pupR, 0, Math.PI * 2); ctx.fill();

  // 볼터치
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(cx - 10 * scale, cy + 4 * scale, 2.4 * scale, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 10 * scale, cy + 4 * scale, 2.4 * scale, 0, Math.PI * 2); ctx.fill();

  // 웃는 입 (옵션)
  if (opts.smile) {
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1.6 * scale;
    ctx.beginPath();
    ctx.arc(cx, cy + 5 * scale, 4 * scale, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  }

  ctx.restore();
}

  drawChar(400 + split + 42, artY + 6, 1.5, '#f7c9e0', 0.42, null, { lookLeft: true, smile: true });

  drawChar(400 - split * 0.5 - 16, artY + 3, 1.5, '#c8f0c0', 0.2, null, { smile: true });
  drawChar(400 + split * 0.5 + 16, artY + 3, 1.5, '#a8d8f0', 0.2, null, { smile: true });

  // 현재의 나 (중앙 - 밝은 주황, 글로우)
  ctx.save();

  ctx.shadowBlur = 26;

  // 시작 버튼 (펄스 글로우)
  const pulse = (Math.sin(t * 2.6) + 1) / 2;

    ctx.beginPath(); ctx.ellipse(-3, -3, 10, 7, 0, 0, Math.PI * 2); ctx.fill();
    // 뼈
    ctx.fillStyle = '#f5efe0';
    ctx.fillRect(12, -3, 16, 6);
    ctx.beginPath(); ctx.arc(29, -3, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(29, 3, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  drumstick(368, plateY - 12, -0.35);
  drumstick(424, plateY - 10, 0.3);
  drumstick(396, plateY - 2, -0.05);

  // 김 (모락모락 올라오는 증기)
  for (let i = 0; i < 3; i++) {
    const sx = 370 + i * 30;
    const off = (t * 26 + i * 40) % 70;
    ctx.strokeStyle = `rgba(255,255,255,${0.30 * (1 - off / 70)})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(sx, plateY - 22 - off);
    ctx.quadraticCurveTo(sx + 9, plateY - 34 - off, sx, plateY - 46 - off);
    ctx.stroke();
  }

  // 콜라 컵 2개
  function cup(x, y) {
    ctx.fillStyle = '#e8e8f0';
    ctx.beginPath();
    ctx.moveTo(x - 9, y - 24); ctx.lineTo(x + 9, y - 24);
    ctx.lineTo(x + 6, y); ctx.lineTo(x - 6, y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4a2416';
    ctx.beginPath();
    ctx.moveTo(x - 8, y - 20); ctx.lineTo(x + 8, y - 20);
    ctx.lineTo(x + 6, y - 2); ctx.lineTo(x - 6, y - 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff6b6b';
    ctx.fillRect(x + 2, y - 36, 3, 16);
  }
  cup(300, plateY - 2);
  cup(500, plateY - 2);

  // ══ 두 캐릭터 (식탁에 앉아 마주보기) ══
  const charY = tableY - 48;
  const bob1 = Math.sin(t * 2.1) * 2.5;
  const bob2 = Math.sin(t * 2.1 + 1.1) * 2.5;

  // 의자 등받이
  ctx.fillStyle = '#5c3520';
  ctx.fillRect(200, charY - 30, 12, 90);
  ctx.fillRect(588, charY - 30, 12, 90);

  // 과거의 나 (왼쪽, 하늘색)
  drawChar(255, charY + bob1, 2.0, '#a8d8f0', 0.9, '#d4ecf8', { lookRight: true, smile: true, shadow: false });
  // 현재의 나 (오른쪽, 주황)
  drawChar(545, charY + bob2, 2.0, '#ff9f43', 1, '#ffd9a0', { lookLeft: true, smile: true, shadow: false });

  // 하트 & 반짝임
  for (let i = 0; i < 5; i++) {
    const hy = charY - 50 - ((t * 30 + i * 45) % 110);
    const hx = 400 + Math.sin(t * 1.7 + i * 1.4) * 60;
    const a = 1 - ((t * 30 + i * 45) % 110) / 110;
    ctx.save();
    ctx.globalAlpha = a * 0.85;
    drawText(i % 2 === 0 ? '💛' : '✨', hx, hy, 18, '#fff');
    ctx.restore();
  }

  // 말풍선 (왼쪽 캐릭터)
  ctx.save();
  ctx.globalAlpha = 0.95;
  drawRect(150, charY - 96, 180, 44, '#ffffff');
  drawRect(153, charY - 93, 174, 38, '#f7f7ff');
  ctx.fillStyle = '#f7f7ff';
  ctx.beginPath();
  ctx.moveTo(240, charY - 52); ctx.lineTo(258, charY - 52); ctx.lineTo(246, charY - 38);
  ctx.closePath(); ctx.fill();
  drawText("천만에, 미래의 나!", 240, charY - 68, 13, '#2f3640');
  ctx.restore();

  // 다시 시작 버튼
  const pulse = (Math.sin(t * 2.6) + 1) / 2;
  const b = endingBtn;
  ctx.save();
  ctx.shadowColor = `rgba(255, 230, 109, ${0.35 + pulse * 0.45})`;
  ctx.shadowBlur = 14 + pulse * 10;
  drawRect(b.x, b.y, b.w, b.h, '#6a3fa0');
  ctx.restore();
  drawRect(b.x + 4, b.y + 4, b.w - 8, b.h - 8, '#8654c4');
  ctx.strokeStyle = `rgba(255, 230, 109, ${0.5 + pulse * 0.45})`;
  ctx.lineWidth = 2.5;
  ctx.strokeRect(b.x, b.y, b.w, b.h);
  drawText("타이틀로 돌아가기", 400, b.y + 33, 16, '#ffffff');
}

// ── Stage Select Screen ──
function renderSelect() {
  drawRect(0, 0, 800, 600, '#0a0a16');

  drawText("⏪ REWIND", 400, 90, 40, '#8ecdf7');
  drawText("— 아까의 나야 도와줘 —", 400, 122, 15, '#f7c9e0');
  drawText("움직이면 기록되고, 되감으면 과거의 내가 나타납니다.", 400, 155, 12, '#6a7ab0');
  drawText("과거의 나와 협력해서 퍼즐을 풀어보세요.", 400, 173, 12, '#6a7ab0');

  drawText("✦ STAGE SELECT (PROTOTYPE) ✦", 400, 215, 14, '#ffe66d');

  selectCards = [];
  const cardW = 460, cardH = 78, startY = 240, gap = 14;

  STAGES.forEach((stage, i) => {
    const cy = startY + i * (cardH + gap);
    const cx = 400 - cardW / 2;
    selectCards.push({ x: cx, y: cy, w: cardW, h: cardH, idx: i });

    drawRect(cx, cy, cardW, cardH, '#12122a');
    drawRect(cx + 3, cy + 3, cardW - 6, cardH - 6, '#171735');
    ctx.strokeStyle = '#2a2a55';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx, cy, cardW, cardH);

    // number badge
    drawRect(cx + 14, cy + 14, 50, 50, '#1c1c3a');
    ctx.strokeStyle = '#3f3f75';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx + 14, cy + 14, 50, 50);
    drawText(`${i + 1}`, cx + 39, cy + 47, 24, '#8ecdf7');

    drawText(stage.name, cx + 82, cy + 32, 17, '#ffffff', 'left');
    drawText(stage.sub, cx + 82, cy + 51, 11, '#a0aee0', 'left');
    const tagTxt = `🔑 x${stage.keysCount}   ⏱ ${stage.totalTime}초`;
    drawText(tagTxt, cx + 82, cy + 68, 10, '#8ecdf7', 'left');

    drawText('▶', cx + cardW - 26, cy + cardH/2 + 6, 18, '#ffe66d');
  });

  // Locked stage 3 placeholder
  const lockY = startY + STAGES.length * (cardH + gap);
  const lockX = 400 - cardW / 2;
  drawRect(lockX, lockY, cardW, cardH, '#12122a');
  ctx.globalAlpha = 0.45;
  drawRect(lockX + 14, lockY + 14, 50, 50, '#1c1c3a');
  drawText("3", lockX + 39, lockY + 47, 24, '#55557a');
  drawText("???", lockX + 82, lockY + 32, 17, '#888', 'left');
  drawText("추후 업데이트 예정 (레이저 / 상자 기믹)", lockX + 82, lockY + 51, 11, '#666', 'left');
  ctx.globalAlpha = 1;
  drawText('🔒 SOON', lockX + cardW - 50, lockY + cardH/2 + 4, 11, '#666');

  // 타이틀로 돌아가기 버튼
  drawRect(selectBackBtn.x, selectBackBtn.y, selectBackBtn.w, selectBackBtn.h, '#3a3a5c');
  drawText("◀ 타이틀", selectBackBtn.x + selectBackBtn.w/2, selectBackBtn.y + 19, 11, '#a0aee0');

  drawText("© 2026 DDALKKAK GAMES · REWIND PROTOTYPE", 400, 585, 9, '#3a3a5a');
}

function render() {
  ctx.clearRect(0, 0, 800, 600);

  if (currentScreen === SCREEN.TITLE) {
    renderTitle();
    return;
  }

  if (currentScreen === SCREEN.ENDING) {
    renderEnding();
    return;
  }

  if (currentScreen === SCREEN.SELECT) {
    renderSelect();
    return;
  }

  drawRect(0, 0, 800, 600, '#0a0a16');

  // Top bar
  drawRect(0, 0, 800, 80, '#12122a');
  drawText("REWIND", 20, 32, 22, '#8ecdf7', 'left');
  drawText(`Stage ${stageIdx + 1} · ${STAGES[stageIdx].name}`, 20, 54, 12, '#6a7ab0', 'left');

  const timeColor = timeLeft <= Math.min(15, TOTAL_TIME * 0.2) ? '#ff6b6b' : '#ffffff';
  drawText(`⏱ ${Math.ceil(timeLeft)}초`, 400, 30, 20, timeColor);

  let heldCount = 0;
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (grid[r][c].type === 'key' && keyHeldStatusAt(currentTick, player.col, player.row, r, c)) {
        heldCount++;
      }
    }
  }
  const totalKeys = STAGES[stageIdx].keysCount;
  
  drawText(`🔑 ${heldCount}/${totalKeys} | 이동 ${player.history.length} | 되감기 ${ghosts.length}/${MAX_REWINDS}`, 400, 55, 13, '#a0aee0');

  drawRect(BTN.reset.x, BTN.reset.y, BTN.reset.w, BTN.reset.h, '#4a4a75');
  drawText("RESET", BTN.reset.x + BTN.reset.w/2, BTN.reset.y + 19, 10, '#fff');

  drawRect(BTN.menu.x, BTN.menu.y, BTN.menu.w, BTN.menu.h, '#4a4a75');
  drawText("STAGE 목록", BTN.menu.x + BTN.menu.w/2, BTN.menu.y + 19, 10, '#fff');

  drawGrid();

  ghosts.forEach((g, i) => {
    const s = ghostStateAt(g, currentTick);
    if (!s.alive) return;
    drawEntity(s.col, s.row, GHOST_COLORS[g.colorIdx], 0.55, `과거${i+1}`);
  });

  // 시간의 감시자 렌더링
  watchers.forEach(w => {
    drawWatcher(w.col, w.row, 1);
  });

  drawEntity(player.col, player.row, '#ff9f43', 0.98, '현재', '#ffd9a0');

  // Bottom control bar
  drawRect(0, 510, 800, 90, '#12122a');

  Object.entries(BTN).forEach(([key, b]) => {
    if (key === 'reset' || key === 'menu') return;
    if (key === 'rewind') {
      drawRect(b.x, b.y, b.w, b.h, '#6a3fa0');
      drawRect(b.x + 3, b.y + 3, b.w - 6, b.h - 6, '#8654c4');
      drawText("⏪ 되감기", b.x + b.w/2, b.y + b.h/2 + 6, 16, '#fff');
    } else {
      drawRect(b.x, b.y, b.w, b.h, '#2f2f55');
      drawRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4, '#3f3f75');
      const arrow = { up: '▲', down: '▼', left: '◀', right: '▶' }[key];
      drawText(arrow, b.x + b.w/2, b.y + b.h/2 + 6, 18, '#a8d8f0');
    }
  });

  popups.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.alpha);
    drawText(p.txt, p.x, p.y, 15, p.col);
    ctx.restore();
  });

  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(140, 180, 255, ${flashAlpha * 0.35})`;
    ctx.fillRect(0, 0, 800, 600);
  }

  // ── 감시자 등장 연출 (화면 중앙 대사) ──
  if (watcherIntroTimer > 0) {
    const t = performance.now() / 1000;
    // 페이드 인/아웃 알파 계산 (등장 0.3초 페이드인, 마지막 0.6초 페이드아웃)
    let a = 1;
    if (watcherIntroTimer > 2.7) a = (3.0 - watcherIntroTimer) / 0.3;
    else if (watcherIntroTimer < 0.6) a = watcherIntroTimer / 0.6;

    ctx.save();
    ctx.globalAlpha = a;

    // 붉은 비네트 (화면 전체 붉은 기운)
    const vig = ctx.createRadialGradient(400, 300, 100, 400, 300, 500);
    vig.addColorStop(0, 'rgba(80, 0, 20, 0.2)');
    vig.addColorStop(1, 'rgba(120, 0, 30, 0.75)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, 800, 600);

    // 대사 배너 (위아래 검은 띠)
    const bannerH = 110;
    ctx.fillStyle = 'rgba(10, 0, 5, 0.88)';
    ctx.fillRect(0, 300 - bannerH/2, 800, bannerH);
    // 상하 붉은 라인
    ctx.fillStyle = '#ff0044';
    ctx.fillRect(0, 300 - bannerH/2, 800, 3);
    ctx.fillRect(0, 300 + bannerH/2 - 3, 800, 3);

    // 흔들리는 텍스트 (공포감)
    const shake = Math.sin(t * 28) * 2 * a;
    ctx.shadowColor = '#ff0044';
    ctx.shadowBlur = 22;
    drawText("이놈! 시간의 순리를 어기다니!", 400 + shake, 300 + 4, 30, '#ff5577');
    ctx.shadowBlur = 0;
    drawText("— 시간의 감시자 —", 400, 300 + 38, 12, '#ffaabb');

    ctx.restore();
  }

  if (currentScreen === SCREEN.WIN) {
    drawRect(0, 0, 800, 600, 'rgba(0,0,0,0.8)');
    drawText("🎉 CLEAR! 🎉", 400, 250, 40, '#8ecdf7');
    drawText(`총 이동 ${player.history.length + ghosts.reduce((s,g)=>s+g.history.length,0)}회 | 되감기 ${ghosts.length}회`, 400, 300, 16, '#fff');

    const hasNext = stageIdx + 1 < STAGES.length;
    if (hasNext) {
      drawRect(300, 340, 200, 50, '#6a3fa0');
      drawText("다음 스테이지 ▶", 400, 371, 15, '#fff');
      drawRect(300, 400, 200, 50, '#4a4a75');
      drawText("스테이지 목록", 400, 431, 15, '#fff');
    } else {
      // 마지막 스테이지 클리어 → 엔딩 보기
      drawRect(300, 340, 200, 50, '#c94f4f');
      drawRect(303, 343, 194, 44, '#e06565');
      drawText("🍗 엔딩 보기", 400, 371, 16, '#fff');
      drawRect(300, 400, 200, 50, '#4a4a75');
      drawText("스테이지 목록", 400, 431, 15, '#fff');
    }

  } else if (currentScreen === SCREEN.TIMEUP) {
    drawRect(0, 0, 800, 600, 'rgba(0,0,0,0.8)');
    drawText("⏰ 시간 초과...", 400, 250, 34, '#ff6b6b');
    drawText("과거의 나도 결국 시간에 쫓겼다", 400, 295, 15, '#c0c0e0');
    drawRect(300, 340, 200, 50, '#4a4a75');
    drawText("다시 시도", 400, 371, 15, '#fff');
    drawRect(300, 400, 200, 50, '#4a4a75');
    drawText("스테이지 목록", 400, 431, 15, '#fff');
  } else if (currentScreen === SCREEN.GAMEOVER) {
    // 감시자에게 잡힘
    drawRect(0, 0, 800, 600, 'rgba(20, 0, 8, 0.88)');
    const t = performance.now() / 1000;
    const shake = Math.sin(t * 24) * 2;
    ctx.save();
    ctx.shadowColor = '#ff0044';
    ctx.shadowBlur = 24;
    drawText("👻 붙잡혔다!", 400 + shake, 240, 38, '#ff4466');
    ctx.restore();
    drawText("\"시간의 순리를 어긴 자는 여기서 끝이다.\"", 400, 288, 15, '#ffaabb');
    drawText("— 시간의 감시자 —", 400, 314, 11, '#aa6677');
    drawRect(300, 350, 200, 50, '#8b2e4a');
    drawRect(303, 353, 194, 44, '#a8395c');
    drawText("다시 시도", 400, 381, 15, '#fff');
    drawRect(300, 410, 200, 50, '#4a4a75');
    drawText("스테이지 목록", 400, 441, 15, '#fff');
  }
}

/* ============================================================
   UPDATE LOOP
============================================================ */
function update(dt) {
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].y += popups[i].vy;
    popups[i].alpha -= dt * 1.0;
    if (popups[i].alpha <= 0) popups.splice(i, 1);
  }
  if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 2.5);
  if (watcherIntroTimer > 0) watcherIntroTimer = Math.max(0, watcherIntroTimer - dt);

  if (currentScreen === SCREEN.PLAYING) {
    // 이동을 시작한 후에만 타이머 감소 (history가 있거나 유령이 있는 경우 = 움직였다는 뜻)
    if (player.history.length > 0 || ghosts.length > 0) {
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        currentScreen = SCREEN.TIMEUP;
        audio.playFail();
      }
    }
  }
}

/* ============================================================
   INPUT HANDLING
============================================================ */
function hit(b, x, y) { return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }

function handlePointer(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * (canvas.width / rect.width);
  const y = (clientY - rect.top) * (canvas.height / rect.height);

  if (currentScreen === SCREEN.TITLE) {
    if (hit(titleBtn, x, y)) {
      audio.playClick();
      currentScreen = SCREEN.SELECT;
    }
    return;
  }

  if (currentScreen === SCREEN.ENDING) {
    if (hit(endingBtn, x, y)) {
      audio.playClick();
      currentScreen = SCREEN.TITLE;
    }
    return;
  }

  if (currentScreen === SCREEN.SELECT) {
    if (hit(selectBackBtn, x, y)) {
      audio.playClick();
      currentScreen = SCREEN.TITLE;
      return;
    }
    for (const card of selectCards) {
      if (hit(card, x, y)) {
        audio.playClick();
        loadStage(card.idx);
        return;
      }
    }
    return;
  }

  if (currentScreen === SCREEN.WIN) {
    const hasNext = stageIdx + 1 < STAGES.length;
    // 상단 버튼: 다음 스테이지(있으면) / 엔딩 보기(마지막이면)
    if (x >= 300 && x <= 500 && y >= 340 && y <= 390) {
      audio.playClick();
      if (hasNext) {
        loadStage(stageIdx + 1);
      } else {
        audio.playWin();
        currentScreen = SCREEN.ENDING;
      }
      return;
    }
    // 하단 버튼: 스테이지 목록
    if (x >= 300 && x <= 500 && y >= 400 && y <= 450) {
      audio.playClick();
      goToSelect();
      return;
    }
    return;
  }

  if (currentScreen === SCREEN.TIMEUP) {
    if (x >= 300 && x <= 500 && y >= 340 && y <= 390) {
      audio.playClick();
      resetLevel();
      return;
    }
    if (x >= 300 && x <= 500 && y >= 400 && y <= 450) {
      audio.playClick();
      goToSelect();
      return;
    }
    return;
  }

  if (currentScreen === SCREEN.GAMEOVER) {
    if (x >= 300 && x <= 500 && y >= 350 && y <= 400) {
      audio.playClick();
      resetLevel();
      return;
    }
    if (x >= 300 && x <= 500 && y >= 410 && y <= 460) {
      audio.playClick();
      goToSelect();
      return;
    }
    return;
  }

  if (currentScreen === SCREEN.PLAYING) {
    if (hit(BTN.up, x, y)) attemptMove('up');
    else if (hit(BTN.down, x, y)) attemptMove('down');
    else if (hit(BTN.left, x, y)) attemptMove('left');
    else if (hit(BTN.right, x, y)) attemptMove('right');
    else if (hit(BTN.rewind, x, y)) doRewind();
    else if (hit(BTN.reset, x, y)) { audio.playClick(); resetLevel(); }
    else if (hit(BTN.menu, x, y)) { audio.playClick(); goToSelect(); }
  }
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  audio.init();
  if (e.touches.length > 0) handlePointer(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

canvas.addEventListener('mousedown', (e) => {
  audio.init();
  handlePointer(e.clientX, e.clientY);
});

window.addEventListener('keydown', (e) => {
  audio.init();
  const key = e.code;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','KeyR','Space'].includes(key)) {
    e.preventDefault();
  }
  if (currentScreen !== SCREEN.PLAYING) return;
  if (key === 'KeyW' || key === 'ArrowUp') attemptMove('up');
  else if (key === 'KeyS' || key === 'ArrowDown') attemptMove('down');
  else if (key === 'KeyA' || key === 'ArrowLeft') attemptMove('left');
  else if (key === 'KeyD' || key === 'ArrowRight') attemptMove('right');
  else if (key === 'KeyR' || key === 'Space') doRewind();
});

/* ============================================================
   MAIN LOOP
============================================================ */
function loop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame((t) => { lastTime = t; loop(t); });
</script>
